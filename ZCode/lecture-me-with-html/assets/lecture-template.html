<!DOCTYPE html>
<html lang="zh-CN" data-mode="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
/* ===== lecture-me-with-html · 设计血统:book-distiller 阅读器 =====
   纸面 + 衬线正文 + mono 标号;核心单位是 page(一页一认知任务) */
:root{
  --page:oklch(0.915 0.007 80);--paper:oklch(0.998 0.002 85);--line:oklch(0.82 0.01 80);
  --ink:oklch(0.15 0.01 60);--ink2:oklch(0.32 0.01 60);--ink3:oklch(0.45 0.01 60);
  --blue:oklch(0.55 0.13 250);--blue-bg:oklch(0.935 0.035 250);--blue-ink:oklch(0.22 0.05 250);
  --gold:oklch(0.89 0.14 92);--amber:oklch(0.62 0.13 60);
  --red:oklch(0.55 0.16 25);--red-bg:oklch(0.95 0.03 25);
  --ok:oklch(0.55 0.12 150);--ok-bg:oklch(0.93 0.06 150);
  --serif:"Noto Serif SC","Songti SC",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"IBM Plex Mono","Cascadia Mono",monospace;
}
html[data-mode="dark"]{
  --page:oklch(0.21 0.012 260);--paper:oklch(0.26 0.015 260);--line:oklch(0.42 0.015 260);
  --ink:oklch(0.90 0.005 80);--ink2:oklch(0.75 0.008 80);--ink3:oklch(0.60 0.01 80);
  --blue:oklch(0.72 0.11 250);--blue-bg:oklch(0.32 0.04 250);--blue-ink:oklch(0.85 0.04 250);
  --gold:oklch(0.80 0.10 92);--amber:oklch(0.72 0.11 60);
  --red:oklch(0.70 0.13 25);--red-bg:oklch(0.32 0.035 25);
  --ok:oklch(0.72 0.10 150);--ok-bg:oklch(0.32 0.04 150);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--sans);
  display:grid;grid-template-rows:52px minmax(0,1fr) 46px;overflow:hidden}
.mono{font-family:var(--mono)}
button{font-family:inherit}

/* ===== header ===== */
header{display:flex;align-items:center;gap:12px;padding:0 14px 0 18px;
  border-bottom:1px solid var(--line);background:var(--paper);min-width:0}
.htitle{min-width:0}
.htitle .t1{font-family:var(--serif);font-weight:700;font-size:15px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htitle .t2{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{display:flex;align-items:center;gap:7px;height:34px;padding:0 12px;margin-left:0;
  border:1px solid var(--line);background:var(--paper);border-radius:8px;font-size:13px;
  color:var(--ink2);cursor:pointer;white-space:nowrap}
.hbtn:hover{border-color:var(--ink3);color:var(--ink)}
.hbtn.on{border-color:var(--amber);color:var(--amber)}
.spacer{flex:1}
.pcount{font-family:var(--mono);font-size:12px;color:var(--ink3);white-space:nowrap}
@media(max-width:900px){.hbtn .lbl{display:none}.hbtn{padding:0 10px}}

/* ===== stage & pages ===== */
main{position:relative;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;display:none;padding:34px 20px 72px}
.page.active{display:block;animation:fadein .28s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sheet{max-width:880px;margin:0 auto;background:var(--paper);border:1px solid var(--line);
  box-shadow:0 2px 24px oklch(0.3 0.01 60/.09);padding:44px 52px 36px;
  font-family:var(--serif);font-size:16.5px;line-height:1.95;color:var(--ink)}
@media(max-width:800px){.sheet{padding:26px 20px 28px}}
.kicker{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;color:var(--ink3)}
h1.pt{font-family:var(--serif);font-size:26px;margin:8px 0 0}
.sheet h2{font-family:var(--serif);font-size:19px;margin:1.9em 0 .4em;padding-left:12px;border-left:4px solid var(--blue)}
.sheet p{margin:.9em 0;text-align:justify}
.sheet ul,.sheet ol{margin:.8em 0 .8em 1.6em}
.sheet li{margin:.35em 0}
.sheet em{font-style:normal;background:var(--gold);border-radius:2px;padding:0 2px}
.sheet code{font-family:var(--mono);font-size:.86em;background:var(--blue-bg);color:var(--blue-ink);
  padding:1px 5px;border-radius:4px}
.sheet pre{background:var(--blue-bg);color:var(--blue-ink);border-radius:8px;padding:12px 14px;
  overflow-x:auto;font-size:13px;margin:1em 0}
.sheet blockquote{margin:1em 0;padding:2px 14px;border-left:3px solid var(--line);color:var(--ink2)}
.sheet table{border-collapse:collapse;margin:1.1em auto;font-size:14.5px;width:100%}
.sheet th{font-family:var(--mono);font-weight:400;font-size:11.5px;color:var(--ink3);
  border-bottom:1px solid var(--line);padding:6px 10px;text-align:left}
.sheet td{border-bottom:1px solid var(--line);padding:7px 10px;vertical-align:top}
.sheet a{color:var(--blue)}
.katex{font-size:1.06em}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 2px}

/* capsules & callouts */
.capsule{margin:1.2em 0;padding:13px 16px;background:var(--blue-bg);color:var(--blue-ink);
  border-radius:10px;font-family:var(--sans);font-size:13.5px;line-height:1.75}
.capsule .ctag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--blue);
  display:block;margin-bottom:4px}
.anatomy{width:100%}
.anatomy td:first-child{font-family:var(--mono);color:var(--blue-ink);white-space:nowrap}
.callout{margin:1.2em 0;padding:13px 16px;border-left:4px solid var(--amber);
  background:var(--blue-bg);color:var(--blue-ink);border-radius:0 8px 8px 0;
  font-family:var(--sans);font-size:14px;line-height:1.8}
.visual{margin:1.2em 0;text-align:center}
.visual svg{max-width:100%;height:auto;color:var(--ink)}
.warnbox{margin:1.2em 0;padding:13px 16px;border-left:4px solid var(--red);
  background:var(--red-bg);border-radius:0 8px 8px 0;font-family:var(--sans);font-size:14px;line-height:1.8}

/* sources chips & quiz */
.srcs{margin-top:1.6em;padding-top:.8em;border-top:1px dashed var(--line);
  font-family:var(--sans);font-size:11.5px;color:var(--ink3);display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.srcs .lbl{font-family:var(--mono);letter-spacing:.08em;font-size:10px}
.srcs a{color:var(--blue);text-decoration:none;border:1px solid var(--line);border-radius:20px;padding:1px 9px}
.quiz{margin:1.1em 0;padding:16px 18px;background:var(--blue-bg);border-radius:10px;
  font-family:var(--sans);font-size:14px;line-height:1.75;color:var(--blue-ink);display:grid;gap:9px}
.quiz .qtag{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--blue)}
.quiz button{text-align:left;border:1px solid oklch(0.82 0.05 250);background:oklch(0.98 0.01 250);
  border-radius:8px;padding:8px 14px;font-size:13.5px;cursor:pointer;color:oklch(0.25 0.05 250)}
html[data-mode="dark"] .quiz button{background:oklch(0.30 0.03 250);color:oklch(0.88 0.02 250);border-color:oklch(0.5 0.05 250)}
.quiz button.ok{background:oklch(0.92 0.09 145);border-color:oklch(0.7 0.12 145);color:oklch(0.25 0.08 150)}
.quiz button.no{background:oklch(0.93 0.06 25);border-color:oklch(0.75 0.1 25);color:oklch(0.3 0.1 25)}
.quiz button:disabled{cursor:default}
.quiz .fb{display:none;border-top:1px solid oklch(0.82 0.05 250);padding-top:8px}
.lab{margin:1.2em 0;background:oklch(0.22 0.02 250);border-radius:10px;padding:16px;display:grid;gap:12px}
.lab .cap{font-family:var(--sans);font-size:12.5px;line-height:1.75;color:oklch(0.78 0.03 250)}
.lab .cap b{color:oklch(0.98 0.005 250)}
.lab canvas{display:block;width:100%;border-radius:6px;touch-action:none}
.lab .ctrls{display:flex;flex-wrap:wrap;gap:12px 20px}
.lab .ctrl{flex:1;min-width:170px}
.lab .ctrl label{display:flex;justify-content:space-between;font-size:12.5px;color:oklch(0.75 0.02 250)}
.lab .ctrl label .v{font-family:var(--mono);color:oklch(0.85 0.09 92)}
.lab input[type=range]{width:100%;accent-color:oklch(0.75 0.1 250);margin-top:4px}
.lab .btns{display:flex;flex-wrap:wrap;gap:8px}
.lab .btns button{border:0;border-radius:8px;padding:7px 14px;font-size:12.5px;cursor:pointer;
  background:oklch(0.2 0.06 250);color:oklch(0.98 0.005 250)}
.lab .readout{font-family:var(--mono);font-size:11.5px;color:oklch(0.85 0.09 92)}

/* ===== footer ===== */
footer{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:10px;padding:0 14px;border-top:1px solid var(--line);background:var(--paper)}
footer .prog{position:absolute;top:-1px;left:0;height:2px;background:var(--ink);width:0;transition:width .25s}
.fbtn{border:1px solid var(--line);background:transparent;border-radius:8px;height:32px;
  padding:0 16px;font-size:13px;color:var(--ink2);cursor:pointer}
.fbtn:hover:not(:disabled){color:var(--ink);border-color:var(--ink3)}
.fbtn:disabled{opacity:.35;cursor:default}
.fmid{font-family:var(--mono);font-size:12px;color:var(--ink3)}

/* ===== overlays ===== */
.overlay{position:fixed;inset:0;background:oklch(0.2 0.02 60/.45);display:none;z-index:40}
.overlay.open{display:flex;align-items:center;justify-content:center}
.panelbox{background:var(--paper);border:1px solid var(--line);border-radius:12px;
  width:min(560px,92vw);max-height:82vh;overflow-y:auto;padding:22px 24px}
.panelbox h3{font-family:var(--serif);font-size:17px;margin-bottom:12px}
.panelbox .close{float:right;border:0;background:none;font-size:18px;cursor:pointer;color:var(--ink3)}
.tocitem{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;
  padding:8px 10px;border-radius:6px;cursor:pointer;font-size:14px;color:var(--ink2);font-family:var(--sans)}
.tocitem:hover{background:var(--page)}
.tocitem.cur{background:var(--blue-bg);color:var(--blue-ink);font-weight:600}
.tocitem .n{font-family:var(--mono);font-size:12px;color:var(--ink3);width:30px;flex:none}
.srcgroup{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--ink3);margin:14px 0 6px}
.srcitem{font-size:13px;font-family:var(--sans);color:var(--ink2);margin:6px 0;line-height:1.6}
.srcitem .sid{font-family:var(--mono);color:var(--amber);margin-right:6px}
.srcitem a{color:var(--blue);text-decoration:none}
</style>
<style id="math-css">{{MATH_CSS}}</style>
</head>
<body>
<header>
  <div class="htitle">
    <div class="t1">{{TITLE}}</div>
    <div class="t2">{{SUBTITLE}}</div>
  </div>
  <div class="spacer"></div>
  <div class="pcount" id="pcount">01 / {{TOTAL}}</div>
  <button class="hbtn" id="b-toc"><span class="lbl">目录</span>☰</button>
  <button class="hbtn" id="b-src"><span class="lbl">来源</span>§</button>
  <button class="hbtn" id="b-mode"><span class="lbl">明暗</span>◐</button>
  <button class="hbtn" id="b-reset"><span class="lbl">重学</span>⟲</button>
</header>
<main id="stage">
{{PAGES}}
</main>
<footer>
  <div class="prog" id="prog"></div>
  <button class="fbtn" id="b-prev">← 上一页</button>
  <div class="fmid" id="fmid">P01 · {{FOOTTITLE}}</div>
  <button class="fbtn" id="b-next" style="text-align:right">下一页 →</button>
</footer>
<div class="overlay" id="ov-toc">
  <div class="panelbox">
    <button class="close" data-close="ov-toc">✕</button>
    <h3>目录</h3>
    <div id="toc-list">{{TOC}}</div>
  </div>
</div>
<div class="overlay" id="ov-src">
  <div class="panelbox">
    <button class="close" data-close="ov-src">✕</button>
    <h3>来源清单</h3>
    {{ALLSOURCES}}
    <p style="font-size:12px;color:var(--ink3);margin-top:14px;font-family:var(--sans)">
    证据账本(dossier)为本页唯一事实源;每页底部 chips 指向该页实际引用。</p>
  </div>
</div>
<script>
"use strict";
(function(){
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  const pages=$$(".page");
  const KEY={{KEYJSON}};
  let cur=0;
  const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
  function show(i,keep){cur=clamp(i,0,pages.length-1);
    pages.forEach((p,k)=>p.classList.toggle("active",k===cur));
    const pc=String(cur+1).padStart(2,"0")+" / "+String(pages.length).padStart(2,"0");
    $("#pcount").textContent=pc;
    $("#fmid").textContent="P"+String(cur+1).padStart(2,"0")+" · "+(pages[cur].dataset.foot||"");
    $("#prog").style.width=((cur+1)/pages.length*100)+"%";
    $("#b-prev").disabled=cur===0;$("#b-next").disabled=cur===pages.length-1;
    $$("#toc-list .tocitem").forEach((t,k)=>t.classList.toggle("cur",k===cur));
    pages[cur].scrollTop=0;
    if(!keep){try{localStorage.setItem(KEY.page,cur)}catch(_){}}
    window.dispatchEvent(new CustomEvent("lecturepage",{detail:{index:cur,id:pages[cur].dataset.id}}));
  }
  function go(i){show(i)}
  $("#b-prev").addEventListener("click",()=>go(cur-1));
  $("#b-next").addEventListener("click",()=>go(cur+1));
  document.addEventListener("keydown",e=>{
    if(e.target.matches("input,textarea"))return;
    if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();go(cur+1);}
    else if(e.key==="ArrowLeft"){e.preventDefault();go(cur-1);}
    else if(e.key==="Home"){e.preventDefault();go(0);}
    else if(e.key==="End"){e.preventDefault();go(pages.length-1);}
    else if(e.key==="Escape"){$$(".overlay").forEach(o=>o.classList.remove("open"));}
  });
  /* overlays */
  function toggle(id){const o=document.getElementById(id);const was=o.classList.contains("open");
    $$(".overlay").forEach(x=>x.classList.remove("open"));
    if(!was)o.classList.add("open");}
  $("#b-toc").addEventListener("click",()=>toggle("ov-toc"));
  $("#b-src").addEventListener("click",()=>toggle("ov-src"));
  $$(".overlay .close").forEach(b=>b.addEventListener("click",()=>{
    document.getElementById(b.dataset.close).classList.remove("open")}));
  $$(".overlay").forEach(o=>o.addEventListener("click",e=>{
    if(e.target===o)o.classList.remove("open")}));
  $$("#toc-list .tocitem").forEach((t,k)=>t.addEventListener("click",()=>{
    toggle("ov-toc");go(+t.dataset.i);}));
  /* mode */
  function setMode(m){document.documentElement.dataset.mode=m;
    try{localStorage.setItem(KEY.mode,m)}catch(_){}}
  setMode((()=>{try{return localStorage.getItem(KEY.mode)||"light"}catch(_){return "light"}})());
  const qm=new URLSearchParams(location.search).get("mode");
  if(qm==="dark"||qm==="light")setMode(qm);
  $("#b-mode").addEventListener("click",()=>{
    setMode(document.documentElement.dataset.mode==="light"?"dark":"light");});
  /* reset */
  $("#b-reset").addEventListener("click",()=>{
    try{localStorage.removeItem(KEY.page)}catch(_){}
    go(0);});
  /* quiz */
  $$(".quiz").forEach(q=>{
    const btns=[...q.querySelectorAll("button")];
    btns.forEach(b=>b.addEventListener("click",()=>{
      if(b.dataset.reveal){b.disabled=true;const fb=q.querySelector(".fb");
        if(fb)fb.style.display="block";return;}
      btns.forEach(x=>x.disabled=true);
      b.classList.add(b.dataset.ok?"ok":"no");
      if(!b.dataset.ok){const ok=btns.find(x=>x.dataset.ok);if(ok)ok.classList.add("ok");}
      const fb=q.querySelector(".fb");if(fb)fb.style.display="block";
    }));
  });
  /* restore */
  let saved=0;try{saved=+localStorage.getItem(KEY.page)||0}catch(_){}
  const qp=new URLSearchParams(location.search).get("p");
  if(qp&&+qp>=1&&+qp<=pages.length)saved=+qp-1;
  show(clamp(saved,0,pages.length-1),true);
})();
</script>
</body>
</html>
