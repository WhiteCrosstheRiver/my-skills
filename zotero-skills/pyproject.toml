[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zotero-skills"
version = "0.1.0"
description = "Evidence-grounded Zotero research workflows for Codex and Claude Code"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "truststore>=0.10,<1", "markdown-it-py>=3,<5", "PyYAML>=6,<7", "PyMuPDF>=1.24,<2", "bleach>=6,<7", "Jinja2>=3.1,<4", "bibtexparser>=1.4,<2", "rispy>=0.9,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
zotero-skill = "zotero_skills.cli:main"

[tool.setuptools.packages.find]
where = ["scripts"]

[tool.setuptools.package-data]
zotero_skills = ["assets/*", "assets/katex/*", "assets/katex/fonts/*", "assets/katex/contrib/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
